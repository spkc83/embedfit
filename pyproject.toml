[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "embedfit"
version = "0.0.0"
description = "Few-shot adaptation of pretrained embedding models; vision-first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = []
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/embedfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
