[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "embedfit"
dynamic = ["version"]
description = "Few-shot adaptation of pretrained embedding models; vision-first."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = []
keywords = ["few-shot", "embeddings", "contrastive-learning", "computer-vision"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.optional-dependencies]
torchvision = ["torchvision>=0.16"]
timm = ["timm>=0.9"]
hf = ["transformers>=4.35"]
datasets = ["datasets>=2.14"]
pandas = ["pandas>=2.0"]
all = ["embedfit[torchvision,timm,hf,datasets,pandas]"]
dev = [
    "build>=1.0",
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.hatch.version]
path = "src/embedfit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/embedfit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default runs are offline and CPU-only (ADR 0004): provider tests are opt-in via `-m network`.
addopts = "-ra --strict-markers --strict-config -m 'not network and not slow'"
markers = [
    "network: requires internet access or pretrained checkpoint downloads (excluded by default)",
    "slow: long-running test (excluded by default)",
]

[tool.coverage.run]
source = ["embedfit"]
branch = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/embedfit"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "torchvision.*"]
ignore_missing_imports = true
